name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Verify tag matches project version
        shell: pwsh
        run: |
          [xml]$project = Get-Content .\src\AFMediaBar\AFMediaBar.csproj
          $projectVersion = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($projectVersion -ne $tagVersion) {
            throw "Tag $env:GITHUB_REF_NAME does not match project version $projectVersion."
          }
          $releaseNotes = Get-Content .\RELEASE_NOTES.md -Raw
          if ($releaseNotes -notmatch [regex]::Escape($projectVersion)) {
            throw "RELEASE_NOTES.md does not mention version $projectVersion."
          }
          "VERSION=$projectVersion" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore .\src\AFMediaBar.slnx -r win-x64

      - name: Build
        run: dotnet build .\src\AFMediaBar.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true -p:BuildInParallel=false

      - name: Test layout, policies and settings
        run: dotnet test .\tests\AFMediaBar.Layout.Tests\AFMediaBar.Layout.Tests.csproj -c Release --no-build --no-restore

      - name: Publish self-contained single-file application
        run: dotnet publish .\src\AFMediaBar\AFMediaBar.csproj -c Release -r win-x64 --self-contained true --no-restore -p:ContinuousIntegrationBuild=true -p:BuildInParallel=false -o .\artifacts\publish

      - name: Verify single-file output
        shell: pwsh
        run: |
          $files = @(Get-ChildItem .\artifacts\publish -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne "AFMediaBar.exe") {
            throw "Expected only AFMediaBar.exe, found: $($files.Name -join ', ')"
          }

      # 安装包由与本地构建完全相同的脚本产出；-SkipPublish 复用上一步的发布目录。
      # The installer is produced by the exact script used locally; -SkipPublish reuses the publish directory above.
      - name: Build installer
        shell: pwsh
        run: .\installer\build-installer.ps1 -SkipPublish -EnsureIscc

      - name: Create portable archive and checksums
        shell: pwsh
        run: |
          $archiveName = "AFMediaBar-v$env:VERSION-win-x64.zip"
          $archivePath = Join-Path .\artifacts $archiveName
          Compress-Archive -LiteralPath .\artifacts\publish\AFMediaBar.exe -DestinationPath $archivePath -CompressionLevel Optimal

          $installer = @(Get-ChildItem .\artifacts -Filter 'AFMediaBar-Setup-*.exe' -File)
          if ($installer.Count -ne 1) {
            throw "Expected exactly one installer, found: $($installer.Name -join ', ')"
          }
          $installerFile = $installer[0]

          $archiveHash = (Get-FileHash $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $installerHash = (Get-FileHash $installerFile.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$archiveHash  $archiveName"
            "$installerHash  $($installerFile.Name)"
          ) | Set-Content .\artifacts\SHA256SUMS.txt -Encoding ascii

          "ARCHIVE_NAME=$archiveName" >> $env:GITHUB_ENV
          "INSTALLER_NAME=$($installerFile.Name)" >> $env:GITHUB_ENV
          "INSTALLER_HASH=$installerHash" >> $env:GITHUB_ENV
          "INSTALLER_SIZE=$($installerFile.Length)" >> $env:GITHUB_ENV

      # docs/latest.json 的 packages[] 只能人工填写（含镜像顺序），因此把需要抄写的值直接放进摘要。
      # packages[] in docs/latest.json is filled in by hand (mirror order included), so the values to copy
      # are printed straight into the job summary.
      - name: Summarize manifest values
        shell: pwsh
        run: |
          $sizeMb = [math]::Round([int64]$env:INSTALLER_SIZE / 1MB, 1)
          @(
            "### AF Media Bar $env:VERSION"
            ""
            "Update `docs/latest.json` before publishing the manifest:"
            ""
            '```json'
            '"installer": { "version": "' + $env:VERSION + '" },'
            '"packages": ['
            '  { "url": "https://github.com/Fervent-Tempo/AF-Media-Bar/releases/download/v' + $env:VERSION + '/' + $env:INSTALLER_NAME + '",'
            '    "size": ' + $env:INSTALLER_SIZE + ', "sha256": "' + $env:INSTALLER_HASH + '" }'
            ']'
            '```'
            ""
            "- Installer: ``$env:INSTALLER_NAME`` ($sizeMb MB)"
            "- SHA-256: ``$env:INSTALLER_HASH``"
            "- Portable archive: ``$env:ARCHIVE_NAME``"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            ".\artifacts\$env:INSTALLER_NAME" `
            ".\artifacts\$env:ARCHIVE_NAME" `
            ".\artifacts\SHA256SUMS.txt" `
            --verify-tag `
            --title "AF Media Bar $env:GITHUB_REF_NAME" `
            --notes-file ".\RELEASE_NOTES.md"
